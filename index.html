<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Golden Eagle AI Terms — one concept per page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f8; --panel:#ffffff; --ink:#1b2433; --muted:#5b6677; --line:#dde2ea;
  --rail:#142340; --rail-ink:#e8ecf3; --rail-muted:#9fabc0; --gold:#b9862a; --gold-soft:#f6ecd8;
  --teal:#17625f; --teal-soft:#e3f1ef; --focus:#3a6fd8;
  --display:'Bricolage Grotesque', 'Segoe UI', Arial, sans-serif;
  --body:'Source Sans 3', 'Segoe UI', Arial, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1624; --panel:#172133; --ink:#e9edf4; --muted:#a3aec0; --line:#2a3650;
  --rail:#0a1120; --gold:#e0b04a; --gold-soft:#2f2715; --teal:#7fd3cc; --teal-soft:#13302e; --focus:#7ea6ff; }}
:root[data-theme="dark"]{
  --bg:#0f1624; --panel:#172133; --ink:#e9edf4; --muted:#a3aec0; --line:#2a3650;
  --rail:#0a1120; --gold:#e0b04a; --gold-soft:#2f2715; --teal:#7fd3cc; --teal-soft:#13302e; --focus:#7ea6ff; }
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:320px 1fr;height:100%}
.app.present{grid-template-columns:0 1fr}
.app.present .rail{display:none}

/* rail */
.rail{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;min-height:0}
.brand{padding:24px 22px 14px}
.brand h1{font-family:var(--display);font-size:22px;line-height:1.15;margin:0;font-weight:700}
.brand p{margin:6px 0 0;color:var(--rail-muted);font-size:15px}
.search{margin:6px 18px 12px;position:relative}
.search input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #33456a;background:#1c2e52;color:#fff}
.search input::placeholder{color:#9fabc0}
.index{overflow:auto;padding:0 10px 24px;flex:1}
.theme{margin-top:10px}
.theme > button{width:100%;text-align:left;background:none;border:0;padding:8px 12px;color:var(--gold);font-weight:700;font-size:15px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
:root .theme > button{color:#e0b04a}
.theme ul{list-style:none;margin:0;padding:0}
.theme li button{width:100%;text-align:left;background:none;border:0;color:var(--rail-ink);padding:6px 12px 6px 20px;border-radius:8px;cursor:pointer;font-size:15.5px;line-height:1.3}
.theme li button:hover{background:#1e3157}
.theme li button[aria-current="true"]{background:#e0b04a;color:#142340;font-weight:700}
.theme.collapsed ul{display:none}
.count{color:var(--rail-muted);font-weight:400}

/* main */
.main{display:flex;flex-direction:column;min-height:0;min-width:0}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--panel)}
.topbar .menu{display:none}
.crumb{flex:1;color:var(--muted);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:999px;cursor:pointer;font-size:15px;font-weight:600}
.tbtn[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.stage{flex:1;overflow:auto;padding:48px 56px 32px}
.page{max-width:980px;margin:0 auto}
.meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:var(--muted);font-size:16px}
.wk{background:var(--gold-soft);color:var(--ink);border-radius:999px;padding:3px 12px;font-weight:600}
.term{font-family:var(--display);font-weight:800;font-size:clamp(40px,6.4vw,84px);line-height:1.02;letter-spacing:-0.02em;margin:14px 0 30px;text-wrap:balance}
.meaning{font-size:clamp(20px,2.1vw,26px);line-height:1.5;max-width:46ch;margin:0 0 36px}
.analogy{background:var(--teal-soft);border-left:8px solid var(--teal);border-radius:4px 22px 22px 4px;padding:28px 34px 30px;margin:0 0 28px}
.analogy h2,.work h2{font-family:var(--display);font-size:20px;margin:0 0 10px;font-weight:700}
.analogy h2{color:var(--teal)}
.analogy p{font-family:var(--display);font-size:clamp(22px,2.6vw,32px);line-height:1.35;margin:0;font-weight:500;max-width:40ch}
.work{border-top:1px solid var(--line);padding-top:20px;display:grid;grid-template-columns:160px 1fr;gap:16px;align-items:baseline}
.work h2{color:var(--muted);font-size:17px}
.work p{margin:0;font-size:20px}
.hidden-q .meaning,.hidden-q .analogy,.hidden-q .work{display:none}
.reveal{display:none;margin:8px 0 28px;padding:16px 26px;border-radius:14px;border:2px dashed var(--line);background:var(--panel);font-size:18px;cursor:pointer;font-weight:600}
.hidden-q .reveal{display:inline-block}
.quizhint{display:none;color:var(--muted);margin:-14px 0 18px}
.hidden-q .quizhint{display:block}

.nav{display:flex;gap:12px;align-items:stretch;padding:16px 28px;border-top:1px solid var(--line);background:var(--panel)}
.nav button{flex:1;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 16px;cursor:pointer;min-width:0}
.nav button:last-child{text-align:right}
.nav small{display:block;color:var(--muted);font-size:13px}
.nav span{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav button:disabled{opacity:.4;cursor:default}
.pos{align-self:center;color:var(--muted);font-size:15px;white-space:nowrap;padding:0 6px}

/* home */
.home h2.big{font-family:var(--display);font-size:clamp(36px,5vw,64px);line-height:1.05;margin:0 0 14px;font-weight:800;letter-spacing:-0.02em}
.home .lede{font-size:21px;max-width:52ch;color:var(--muted);margin:0 0 34px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:2px;background:var(--line);border:1px solid var(--line)}
.themes button{background:var(--panel);border:0;text-align:left;padding:22px 22px 24px;cursor:pointer}
.themes button:hover{background:var(--gold-soft)}
.themes b{display:block;font-family:var(--display);font-size:22px;line-height:1.2;margin-bottom:6px}
.themes span{color:var(--muted);font-size:16px}
.keys{margin-top:30px;color:var(--muted);font-size:15px}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-family:var(--body);background:var(--panel)}

.present .stage{padding:6vh 7vw}
.present .page{max-width:1200px}
.present .term{font-size:clamp(48px,8vw,110px)}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 20% 0 0;z-index:5;transform:translateX(-102%);transition:transform .2s ease;padding-top:env(safe-area-inset-top,0px)}
  .app.drawer .rail{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}
  .topbar .menu{display:inline-block}
  .stage{padding:28px 20px}
  .work{grid-template-columns:1fr;gap:4px}
  .analogy{padding:22px 22px}
  .pos{display:none}
  .tbtn.opt{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (prefers-reduced-motion:no-preference){ .page.enter{animation:in .28s ease-out} @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}} }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="rail" aria-label="Term index">
    <div class="brand"><h1>Golden Eagle AI Terms</h1><p>One concept per page, with an everyday example.</p></div>
    <div class="search"><label for="q" class="sr" style="position:absolute;left:-9999px">Search terms</label><input id="q" type="search" placeholder="Search a term…" autocomplete="off"></div>
    <nav class="index" id="index"></nav>
  </aside>
  <main class="main">
    <div class="topbar">
      <button class="tbtn menu" id="menuBtn" aria-label="Open term index">Terms</button>
      <div class="crumb" id="crumb"></div>
      <button class="tbtn opt" id="homeBtn">All themes</button>
      <button class="tbtn" id="quizBtn" aria-pressed="false" title="Hide the explanation until you reveal it (Q)">Quiz mode</button>
      <button class="tbtn" id="shuffleBtn" title="Jump to a random term (R)">Random</button>
      <button class="tbtn opt" id="presentBtn" aria-pressed="false" title="Full-screen teaching view (P)">Present</button>
    </div>
    <div class="stage" id="stage"></div>
    <div class="nav" id="navbar">
      <button id="prevBtn"><small>Previous</small><span id="prevName"></span></button>
      <div class="pos" id="pos"></div>
      <button id="nextBtn"><small>Next</small><span id="nextName"></span></button>
    </div>
  </main>
</div>
<script>
const CATS = [{"key": "found", "name": "AI foundations", "blurb": "AI is the big umbrella; each layer of the AI Onion is a narrower part of the one outside it."}, {"key": "models", "name": "Models and how they work", "blurb": "How language models read, predict and are tuned."}, {"key": "prompt", "name": "Prompting", "blurb": "How to ask so the AI answers well, every time."}, {"key": "json", "name": "Structured outputs and hallucinations", "blurb": "Making AI output usable by systems, and trustworthy."}, {"key": "rag", "name": "Knowledge assistants and RAG", "blurb": "Letting AI look things up in your documents before it answers."}, {"key": "agents", "name": "Agents and automation", "blurb": "When AI stops just replying and starts doing."}, {"key": "strategy", "name": "AI strategy and transformation", "blurb": "Choosing where AI creates value and leading the change."}, {"key": "build", "name": "Build vs buy and vendor evaluation", "blurb": "Deciding what to license, what to build, and what it really costs."}, {"key": "gov", "name": "Governance, risk and security", "blurb": "Making AI safe to scale."}, {"key": "tools", "name": "Enterprise workspace AI and tools", "blurb": "AI inside the tools people already use."}];
const TERMS = [{"cat": "found", "term": "Artificial Intelligence (AI)", "wk": "1", "meaning": "Computer systems doing tasks that normally need human intelligence: understanding language, recognising patterns, making decisions.", "everyday": "Your phone's map app noticing traffic and suggesting a faster route home is AI quietly at work.", "work": "A bank chatbot answering balance queries at 2 a.m."}, {"cat": "found", "term": "Machine Learning (ML)", "wk": "1", "meaning": "AI that learns patterns from data instead of following hand-written rules.", "everyday": "A child learns what a dog is by seeing many dogs, not by reading a rulebook. ML learns the same way, from examples.", "work": "A model that learns which card transactions look fraudulent."}, {"cat": "found", "term": "Neural network", "wk": "1", "meaning": "An ML model made of layers of connected 'neurons' that pass signals forward, loosely inspired by the brain.", "everyday": "Like a relay of people passing a message, each adding a small judgement, until the last person shouts the answer.", "work": "Reading handwritten amounts on cheques."}, {"cat": "found", "term": "Deep Learning", "wk": "1", "meaning": "Neural networks with many layers, able to learn very complex patterns from large amounts of data.", "everyday": "A shallow network is a quick glance; deep learning is a detective looking again and again, noticing finer details each time.", "work": "Speech-to-text in meeting transcription."}, {"cat": "found", "term": "Generative AI (GenAI)", "wk": "1", "meaning": "AI that creates new content such as text, images, audio or code, rather than only sorting or predicting.", "everyday": "A friend who has read every cookbook and invents a brand-new recipe from what you have in the fridge.", "work": "Drafting a client proposal in ChatGPT or Claude."}, {"cat": "found", "term": "Predictive AI", "wk": "1", "meaning": "AI that forecasts or classifies based on historical data.", "everyday": "The weather forecast: it does not create rain, it predicts it from past patterns.", "work": "Predicting which customers may leave next quarter."}, {"cat": "found", "term": "The AI Onion", "wk": "1", "meaning": "The programme's layered model: AI contains ML, which contains Neural Networks, then Deep Learning, then Generative AI.", "everyday": "Like Chennai inside Tamil Nadu inside India inside Asia: each is part of the bigger one around it.", "work": "Explaining to leaders that GenAI is only one part of AI."}, {"cat": "found", "term": "Narrow AI", "wk": "1", "meaning": "AI built for one task or a small set of tasks. All AI in use today is narrow.", "everyday": "A brilliant chess player who cannot boil an egg. Expert in one thing, lost outside it.", "work": "A CV-screening model that only screens CVs."}, {"cat": "found", "term": "AGI (Artificial General Intelligence)", "wk": "1", "meaning": "A hypothetical AI that matches humans across almost any task. It does not exist yet.", "everyday": "A colleague who could do any job in the building equally well, from accounts to marketing. Still science fiction.", "work": "A strategy-debate topic, not a product you can buy."}, {"cat": "found", "term": "Training data", "wk": "1", "meaning": "The examples a model learns from.", "everyday": "The past exam papers a student practises with. Better papers, better results.", "work": "Years of past loan applications and their outcomes."}, {"cat": "found", "term": "Algorithm", "wk": "1", "meaning": "A step-by-step method a computer follows. In ML, it is the learning recipe.", "everyday": "A recipe: exact steps that turn ingredients into a dish.", "work": "The method that turns last year's sales into a forecast."}, {"cat": "found", "term": "Supervised learning", "wk": "1", "meaning": "Learning from labelled examples, where each input comes with the correct answer.", "everyday": "Flashcards with the answer on the back. You check and learn.", "work": "Emails labelled 'spam' or 'not spam' teach a spam filter."}, {"cat": "found", "term": "Unsupervised learning", "wk": "1", "meaning": "Finding patterns in data that has no labels.", "everyday": "Sorting a mixed box of buttons into piles by colour and size without anyone telling you the groups.", "work": "Grouping customers into segments by behaviour."}, {"cat": "found", "term": "Computer vision", "wk": "1", "meaning": "AI that understands images and video.", "everyday": "Your phone unlocking when it recognises your face.", "work": "Reading invoice details from scanned PDFs."}, {"cat": "found", "term": "Natural Language Processing (NLP)", "wk": "1", "meaning": "AI that understands and works with human language.", "everyday": "Autocorrect understanding you meant 'meeting', not 'meting'.", "work": "Sentiment analysis on customer feedback."}, {"cat": "found", "term": "Multimodal AI", "wk": "1", "meaning": "AI that handles more than one type of input or output: text, images, audio, video.", "everyday": "A person who can read your note, look at your photo and listen to your voice message, then reply to all of it.", "work": "Photographing a whiteboard and asking for meeting notes."}, {"cat": "found", "term": "Foundation model", "wk": "1", "meaning": "A large general-purpose model trained on broad data and adapted to many tasks.", "everyday": "A well-educated graduate who can be trained into any role quickly.", "work": "The GPT, Claude and Gemini model families."}, {"cat": "found", "term": "Use case", "wk": "1", "meaning": "A specific business problem AI is applied to.", "everyday": "Not 'I want a kitchen gadget' but 'I want to make dosa batter faster'. The specific job.", "work": "'Summarise every customer complaint into a ticket.'"}, {"cat": "models", "term": "Large Language Model (LLM)", "wk": "1", "meaning": "A very large model trained on huge amounts of text to understand and generate language.", "everyday": "A super-reader who has read most of a giant library and can write in any style, though not always accurately.", "work": "GPT, Claude, Gemini and Llama."}, {"cat": "models", "term": "Small Language Model (SLM)", "wk": "1", "meaning": "A smaller, cheaper, faster model, often run on a laptop, phone or private server.", "everyday": "A pocket dictionary instead of an encyclopedia: less knowledge, but quick, cheap and always with you.", "work": "An on-premise model for sensitive HR documents."}, {"cat": "models", "term": "Parameters", "wk": "1", "meaning": "The internal values a model learns during training; a rough measure of its size.", "everyday": "The countless tiny knobs on a giant mixing desk, each set during training to get the sound right.", "work": "'A 7-billion-parameter model.'"}, {"cat": "models", "term": "Token", "wk": "1, 4", "meaning": "A chunk of text — part of a word, a word or punctuation — that the model reads and writes.", "everyday": "Like counting a taxi fare in kilometres: AI usage is counted in tokens, roughly three-quarters of a word each.", "work": "Pricing and limits are counted in tokens."}, {"cat": "models", "term": "Context window", "wk": "1, 7", "meaning": "How much text the model can consider at once: your prompt, files and the conversation so far.", "everyday": "The size of a desk: only so many papers fit on it at once. Too many and the earliest ones fall off.", "work": "Whether a 200-page report fits in one chat."}, {"cat": "models", "term": "Training", "wk": "1", "meaning": "The expensive process of teaching a model from data.", "everyday": "Years of schooling and university, done once, before the job starts.", "work": "Done by the model provider, not by your company."}, {"cat": "models", "term": "Inference", "wk": "4", "meaning": "Using a trained model to produce an answer, every time you send a prompt.", "everyday": "The trained doctor seeing each patient. Every consultation is an inference, and each one has a cost.", "work": "Each Copilot request is an inference with a cost."}, {"cat": "models", "term": "Fine-tuning", "wk": "4, 7", "meaning": "Further training a model on your own examples to change its behaviour or style.", "everyday": "Sending a qualified chef on a short course in your restaurant's own recipes.", "work": "Teaching a model your house writing style."}, {"cat": "models", "term": "Knowledge cut-off", "wk": "2", "meaning": "The date after which a model has no training information.", "everyday": "A friend back from a year at a remote research station: smart, but they missed this year's news.", "work": "Why a model may not know last month's regulation."}, {"cat": "models", "term": "Temperature", "wk": "2", "meaning": "A setting for randomness: low gives focused, repeatable answers; high gives varied, creative ones.", "everyday": "Low temperature is a careful accountant; high temperature is a jazz musician improvising.", "work": "Low for data extraction, higher for brainstorming taglines."}, {"cat": "models", "term": "Top-K", "wk": "2", "meaning": "The model picks the next word only from the K most likely options.", "everyday": "A restaurant that shows you only the top 5 dishes instead of the whole menu.", "work": "Limits wild word choices in generated text."}, {"cat": "models", "term": "Top-P (nucleus sampling)", "wk": "2", "meaning": "The model picks from the smallest set of likely words whose probabilities add up to P.", "everyday": "Choosing from dishes that together make up 90% of what people usually order, however many that is.", "work": "Another dial for balancing creativity and focus."}, {"cat": "models", "term": "Reasoning model", "wk": "2", "meaning": "A model designed to work through a problem step by step before answering.", "everyday": "A student who works the sum out on rough paper before writing the final answer.", "work": "Multi-step analysis, maths and planning tasks."}, {"cat": "models", "term": "Open-weight model", "wk": "4", "meaning": "A model whose internal weights are published, so organisations can run it on their own systems.", "everyday": "A recipe published in full, so you can cook it in your own kitchen.", "work": "Hosting a Llama-family model in your own cloud."}, {"cat": "models", "term": "Closed / proprietary model", "wk": "4", "meaning": "A model you can use only through the provider's app or API.", "everyday": "A famous restaurant dish: you can order it, but the recipe stays in their kitchen.", "work": "Using GPT or Claude through their APIs."}, {"cat": "models", "term": "API (Application Programming Interface)", "wk": "4", "meaning": "A way for one piece of software to talk directly to another.", "everyday": "A waiter: you do not walk into the kitchen; you give the order, and the waiter brings back the dish.", "work": "Your CRM sending text to an AI model to summarise."}, {"cat": "models", "term": "Latency", "wk": "4", "meaning": "The delay between sending a request and receiving the answer.", "everyday": "The wait between ordering at the counter and your coffee arriving.", "work": "Why a customer chatbot feels slow."}, {"cat": "prompt", "term": "Prompt", "wk": "2", "meaning": "The instruction or question you give an AI.", "everyday": "The brief you give a tailor: the clearer it is, the better the fit.", "work": "'Summarise this email in three bullets.'"}, {"cat": "prompt", "term": "Prompt engineering", "wk": "2", "meaning": "The skill of designing prompts that reliably get the result you need.", "everyday": "Learning exactly how to brief a new assistant so the work comes back right first time.", "work": "Building a reusable weekly-report prompt for the team."}, {"cat": "prompt", "term": "System prompt / custom instructions", "wk": "2, 7", "meaning": "Standing instructions that shape every answer in a chat, GPT or project.", "everyday": "The house rules pinned on a new employee's desk on day one, which apply to every task.", "work": "'You are our HR policy assistant. Answer only from the uploaded policies.'"}, {"cat": "prompt", "term": "Role prompting", "wk": "2", "meaning": "Asking the AI to act as a specific expert.", "everyday": "Asking the same friend 'as a doctor' versus 'as a lawyer' changes how they answer.", "work": "'Act as a credit risk analyst reviewing this application.'"}, {"cat": "prompt", "term": "Zero-shot", "wk": "2", "meaning": "Asking for a task with no examples.", "everyday": "Asking a new cook to make 'something South Indian' with no sample dish.", "work": "'Classify this complaint.'"}, {"cat": "prompt", "term": "One-shot", "wk": "2", "meaning": "Giving one example before the task.", "everyday": "Showing the cook one plate of idli before asking for more.", "work": "One sample complaint with its correct category, then the new one."}, {"cat": "prompt", "term": "Few-shot", "wk": "2", "meaning": "Giving several examples so the AI copies the pattern.", "everyday": "Showing a child three solved maths problems before giving them a new one.", "work": "Three labelled tickets, then a new one to label."}, {"cat": "prompt", "term": "Chain of Thought (CoT)", "wk": "2", "meaning": "Asking the AI to reason step by step before giving its answer.", "everyday": "'Show your working' in a school maths exam, which catches mistakes along the way.", "work": "'Work through the calculation step by step, then give the final figure.'"}, {"cat": "prompt", "term": "Prompt chaining", "wk": "2", "meaning": "Splitting a big task into linked prompts, where each output feeds the next.", "everyday": "An assembly line: one station cuts, the next stitches, the last packs.", "work": "Transcript → summary → Jira tickets → team email."}, {"cat": "prompt", "term": "Multi-step prompt", "wk": "2", "meaning": "One prompt containing numbered steps for the AI to follow in order.", "everyday": "A recipe card with steps 1 to 5 on a single card.", "work": "'1) Extract actions 2) Assign owners 3) Draft the email.'"}, {"cat": "prompt", "term": "Prompt framework", "wk": "2", "meaning": "A memorable structure for writing prompts. CRISPE is one: Capacity and role, Insight, Statement, Personality, Experiment.", "everyday": "A checklist pilots run before take-off, so nothing important is forgotten.", "work": "Using CRISPE to brief a marketing post. [Add RICE, DARE and QUEST from your Week 2 slides.]"}, {"cat": "prompt", "term": "Delimiters", "wk": "2", "meaning": "Symbols that separate your instructions from the content to work on.", "everyday": "Putting the letter in an envelope with a sticky note on top: the note says what to do, the envelope holds the material.", "work": "Putting the document inside triple quotes \"\"\" … \"\"\"."}, {"cat": "prompt", "term": "Iteration", "wk": "2", "meaning": "Improving a prompt step by step based on what comes back.", "everyday": "Adjusting salt after tasting the sambar, then tasting again.", "work": "v1 was too long, so v2 adds 'under 100 words'."}, {"cat": "prompt", "term": "Prompt library", "wk": "2, 8", "meaning": "A shared, tested collection of prompts for a team.", "everyday": "A family recipe book that everyone adds their best dishes to.", "work": "A Notion page of approved sales prompts."}, {"cat": "json", "term": "Structured output", "wk": "2, JSON", "meaning": "AI output in a fixed, machine-readable shape.", "everyday": "A printed form with fixed boxes, instead of a handwritten letter. Anyone can find the phone number instantly.", "work": "Every complaint returned with the same six fields."}, {"cat": "json", "term": "JSON", "wk": "2, JSON", "meaning": "A strict text format of labels (keys) and values that machines can read.", "everyday": "A neatly labelled spice box: every jar has a label and something inside, so anyone can find the jeera.", "work": "{\"customer\": \"Meena\", \"urgency\": \"high\"}"}, {"cat": "json", "term": "Key-value pair", "wk": "JSON", "meaning": "A label and its data.", "everyday": "A name tag at a conference: 'Name: Priya'.", "work": "\"city\": \"Chennai\""}, {"cat": "json", "term": "Object and array", "wk": "JSON", "meaning": "An object { } groups related key-value pairs; an array [ ] is an ordered list.", "everyday": "An object inks return 'page not found'."}, {"cat": "json", "term": "Unfaithful to source", "wk": "JSON", "meaning": "The answer adds to, or changes, what your document actually says.", "everyday": "Retelling a friend's story and adding a dramatic ending they never mentioned.", "work": "A summary adding 'leave can be carried forward' when the policy never says so."}, {"cat": "json", "term": "Field invention", "wk": "JSON", "meaning": "Plausible values placed into JSON fields that should be empty.", "everyday": "Filling a blank 'phone number' box on a form with a made-up number so it doesn't look empty.", "work": "An invented GST number on an extracted invoice."}, {"cat": "json", "term": "Grounding", "wk": "7, JSON", "meaning": "Making the AI answer only from sources you provide.", "everyday": "An open-book exam with one rule: answer only from this book, and say so if it isn't there.", "work": "'Use ONLY the document below.'"}, {"cat": "json", "term": "Citation", "wk": "7", "meaning": "The AI showing where each part of its answer came from.", "everyday": "A student's footnotes: you can check every claim against the source.", "work": "NotebookLM's numbered source links."}, {"cat": "json", "term": "Self-check / chain of verification", "wk": "JSON", "meaning": "Asking the AI to list and verify its own claims.", "everyday": "Proofreading your own email before pressing Send, line by line.", "work": "'Mark each claim Verified or Unverified and say how to check it.'"}, {"cat": "json", "term": "D.E.B.U.G.", "wk": "JSON", "meaning": "The programme's method: Detect, Examine, Bring sources, Uncertainty allowed, Guard and verify.", "everyday": "A mechanic's routine: hear the noise, find the cause, use the right part, admit what isn't known, test-drive before handing back.", "work": "Debugging a summary that invented a policy rule."}, {"cat": "json", "term": "Trust-by-design schema", "wk": "JSON", "meaning": "JSON that carries the answer plus source_quote, confidence, not_found and needs_hu  wall: no diving, no glass, shower first.", "work": "'No customer PII in public AI tools.'"}, {"cat": "gov", "term": "Responsible AI", "wk": "3, 8", "meaning": "Using AI fairly, transparently, safely and accountably.", "everyday": "A responsible driver: follows rules, signals clearly, owns the mistakes.", "work": "Telling customers when AI made a decision about them."}, {"cat": "gov", "term": "Bias", "wk": "1, 3", "meaning": "Unfair, skewed outcomes caused by data or design.", "everyday": "A cricket selector who has only ever watched players from one city.", "work": "A hiring model favouring one college."}, {"cat": "gov", "term": "Explainability", "wk": "3", "meaning": "Being able to show why an AI produced an outcome.", "everyday": "A teacher explaining why marks were cut, not just giving the score.", "work": "Giving reasons for a declined credit application."}, {"cat": "gov", "term": "Data leakage", "wk": "1, 8", "meaning": "Confidential data leaving the organisation through AI tools.", "everyday": "Discussing a confidential deal loudly on a crowded train.", "work": "Source code pasted into a public AI service."}, {"cat": "gov", "term": "PII (Personally Identifiable Information)", "wk": "1, 8", "meaning": "Data that identifies a specific person.", "everyday": "The details on your Aadhaar card or passport.", "work": "Names, phone numbers, Aadhaar or account numbers."}, {"cat": "gov", "term": "Anonymisation", "wk": "1, JSON", "meaning": "Removing or masking personal details before using data.", "everyday": "Blurring faces in a photo before posting it.", "work": "Replacing names with 'Customer A' before prompting."}, {"cat": "gov", "term": "DLP (Data Loss Prevention)", "wk": "8", "meaning": "Tools and rules that stop sensitive data going where it shouldn't.", "everyday": "Airport security scanning bags for things not allowed on board.", "work": "Blocking card numbers in Copilot prompts."}, {"cat": "gov", "term": "Zero Trust", "wk": "8", "meaning": "A security approach: never trust by default; verify every user, device and request.", "everyday": "A gated community that checks ID at every gate, even for people who live there.", "work": "Copilot only sees files the user already has permission to see."}, {"cat": "gov", "term": "Microsoft Entra ID", "wk": "8", "meaning": "Microsoft's identity and access service, formerly Azure Active Directory.", "everyday": "The office ID card system that decides which doors your card opens.", "work": "Controlling who can use Copilot."}, {"cat": "gov", "term": "Microsoft Purview", "wk": "8", "meaning": "Microsoft's data governance, compliance and protection suite.", "everyday": "A records room with labels, locks and a logbook of who took which file.", "work": "Sensitivity labels and audit logs for Copilot usage."}, {"cat": "gov", "term": "Audit trail", "wk": "8", "meaning": "A record of who did what, when, with which AI.", "everyday": "A building's visitor register: name, time in, time out.", "work": "Logs of every AI-generated customer email."}, {"cat": "gov", "term": "Prompt injection", "wk": "Build, 8", "meaning": "Hidden instructions in content that try to hijack an AI.", "everyday": "A forged note slipped to a bank teller saying 'the manager says give this person cash'.", "work": "A web page telling an agent to email out confidential files."}, {"cat": "gov", "term": "EU AI Act", "wk": "3", "meaning": "European Union law that classifies AI systems by risk level, with matching obligations.", "everyday": "Food safety grades: the riskier the kitchen, the stricter the inspection.", "work": "Relevant for companies serving EU customers."}, {"cat": "gov", "term": "India DPDP Act 2023", "wk": "3", "meaning": "India's Digital Personal Data Protection Act, governing how personal data is collected and processed.", "everyday": "Rules for a tailor who keeps your measurements: use them only for your clothes, and with your consent.", "work": "Consent and purpose rules for customer data used with AI."}, {"cat": "tools", "term": "Microsoft 365 Copilot", "wk": "4, 8", "meaning": "An AI assistant inside Word, Excel, PowerPoint, Outlook and Teams, working with your organisation's data.", "everyday": "A sharp assistant sitting inside your office, who already knows where every file is.", "work": "'Summarise this Teams meeting and list the action items.'"}, {"cat": "tools", "term": "Copilot Chat", "wk": "8", "meaning": "Microsoft's chat experience for work, grounded in web or work content depending on the licence.", "everyday": "An office helpdesk you can ask anything, which may or may not see your files depending on your pass.", "work": "Drafting an email from a policy file."}, {"cat": "tools", "term": "Copilot Studio", "wk": "8", "meaning": "Microsoft's low-code tool for building custom copilots and agents.", "everyday": "A workshop where you assemble your own helper robot from ready-made parts.", "work": "An IT helpdesk agent for password and access requests."}, {"cat": "tools", "term": "Microsoft Graph", "wk": "8", "meaning": "The data layer connecting a user's email, files, chats and calendar, which Copilot draws on.", "everyday": "The office's internal phone directory and filing index, all linked together.", "work": "Why Copilot can find 'the deck Priya shared last week'."}, {"cat": "tools", "term": "Atlassian Intelligence / Jira AI", "wk": "8", "meaning": "AI features built into Jira and Confluence.", "everyday": "A project clerk who reads every ticket and gives you the summary.", "work": "Summarising a long Jira ticket thread."}, {"cat": "tools", "term": "Atlassian Rovo", "wk": "8", "meaning": "Atlassian's AI for search, chat and agents across Jira, Confluence and connected apps.", "everyday": "A team librarian who knows where every project document and ticket lives.", "work": "Asking 'What is blocking the payments release?'"}, {"cat": "tools", "term": "Rovo agents", "wk": "8", "meaning": "Configurable AI agents inside Atlassian tools that carry out tasks.", "everyday": "Specialist helpers on the project team, each with one job.", "work": "An agent that drafts the sprint report."}, {"cat": "tools", "term": "Automated sprint report", "wk": "8", "meaning": "A workflow that gathers sprint data and drafts the report with AI.", "everyday": "A dishwasher for status reports: load the data, get it back clean.", "work": "Week 8 deliverable."}, {"cat": "tools", "term": "AI Opportunity Document", "wk": "8", "meaning": "A ranked list of high-ROI AI use cases for your department.", "everyday": "A shortlist of the five home upgrades that will save the most money.", "work": "Week 8 deliverable: five ranked use cases."}, {"cat": "tools", "term": "ChatGPT", "wk": "1, 2", "meaning": "OpenAI's general-purpose AI assistant.", "everyday": "A versatile all-rounder: writer, explainer and brainstorm partner.", "work": "Drafting, analysis and Custom GPTs."}, {"cat": "tools", "term": "Claude", "wk": "2, 7", "meaning": "Anthropic's AI assistant, with Projects for document-based work.", "everyday": "A careful analyst who reads long documents thoroughly.", "work": "Long-document analysis and reasoning."}, {"cat": "tools", "term": "Gemini", "wk": "1, 2", "meaning": "Google's AI assistant, built into Google Workspace.", "everyday": "A helper who lives inside your Gmail, Docs and Drive.", "work": "Summarising a Google Doc."}, {"cat": "tools", "term": "Perplexity", "wk": "2, JSON", "meaning": "An AI search engine that answers with linked sources.", "everyday": "A friend who answers and shows you the newspaper clipping too.", "work": "Quick research with citations you can check."}, {"cat": "tools", "term": "Notion AI", "wk": "7", "meaning": "AI features inside Notion workspaces.", "everyday": "A notebook that can tidy and summarise its own pages.", "work": "Turning meeting notes into a task list."}, {"cat": "tools", "term": "Agent readiness", "wk": "8", "meaning": "Whether data, permissions, governance and people are ready for AI agents.", "everyday": "Childproofing the house before the toddler starts walking.", "work": "Cleaning up over-shared SharePoint sites before enabling agents."}];
const app=document.getElementById('app'), stage=document.getElementById('stage');
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
TERMS.forEach((t,i)=>{t.i=i;t.id=slug(t.term)});
const byId=Object.fromEntries(TERMS.map(t=>[t.id,t]));
const catName=Object.fromEntries(CATS.map(c=>[c.key,c]));
let quiz=false, current=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wkLabel=w=>w.split(',').map(x=>x.trim()).map(x=>/^\d+$/.test(x)?'Week '+x:(x==='JSON'?'JSON week':x==='Build'?'Build track':x)).join(', ');

function buildIndex(filter=''){
  const f=filter.trim().toLowerCase(); const idx=document.getElementById('index'); idx.innerHTML='';
  CATS.forEach(c=>{
    const items=TERMS.filter(t=>t.cat===c.key && (!f || (t.term+' '+t.meaning+' '+t.everyday).toLowerCase().includes(f)));
    if(!items.length) return;
    const d=document.createElement('div'); d.className='theme';
    d.innerHTML=`<button aria-expanded="true">${esc(c.name)} <span class="count">${items.length}</span></button><ul>${items.map(t=>`<li><button data-id="${t.id}" ${current&&current.id===t.id?'aria-current="true"':''}>${esc(t.term)}</button></li>`).join('')}</ul>`;
    d.firstChild.onclick=()=>{d.classList.toggle('collapsed');d.firstChild.setAttribute('aria-expanded',!d.classList.contains('collapsed'))};
    idx.appendChild(d);
  });
  if(!idx.children.length) idx.innerHTML='<p style="padding:12px;color:#9fabc0">No term matches. Try a shorter word, such as “agent” or “cost”.</p>';
  idx.querySelectorAll('li button').forEach(b=>b.onclick=()=>{go(b.dataset.id);app.classList.remove('drawer')});
}

function showHome(){
  current=null; location.hash=''; buildIndex(document.getElementById('q').value);
  document.getElementById('crumb').textContent='All themes';
  document.getElementById('navbar').style.display='none';
  stage.innerHTML=`<div class="page home enter"><h2 class="big">Every AI term from the programme, one page at a time.</h2>
  <p class="lede">${TERMS.length} concepts across ${CATS.length} themes. Each page gives the meaning, an everyday comparison anyone can picture, and how it shows up at work.</p>
  <div class="themes">${CATS.map(c=>`<button data-cat="${c.key}"><b>${esc(c.name)}</b><span>${TERMS.filter(t=>t.cat===c.key).length} terms. ${esc(c.blurb)}</span></button>`).join('')}</div>
  <p class="keys">Teaching shortcuts: <kbd>←</kbd> <kbd>→</kbd> move between terms · <kbd>Q</kbd> quiz mode · <kbd>Space</kbd> reveal · <kbd>R</kbd> random · <kbd>P</kbd> present · <kbd>/</kbd> search</p></div>`;
  stage.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>go(TERMS.find(t=>t.cat===b.dataset.cat).id));
}

function render(t){
  current=t; const c=catName[t.cat];
  document.getElementById('navbar').style.display='';
  document.getElementById('crumb').textContent=c.name;
  stage.innerHTML=`<article class="page enter ${quiz?'hidden-q':''}" id="pg">
    <div class="meta"><span>${esc(c.name)}</span><span class="wk">${esc(wkLabel(t.wk))}</span></div>
    <h2 class="term">${esc(t.term)}</h2>
    <p class="quizhint">Ask the room: what does this mean, and where have you seen it?</p>
    <button class="reveal" id="rev">Reveal the explanation</button>
    <p class="meaning">${esc(t.meaning)}</p>
    <section class="analogy"><h2>Think of it like this</h2><p>${esc(t.everyday)}</p></section>
    <section class="work"><h2>At work</h2><p>${esc(t.work)}</p></section>
  </article>`;
  const r=document.getElementById('rev'); if(r) r.onclick=reveal;
  stage.scrollTop=0;
  const p=TERMS[t.i-1], n=TERMS[t.i+1];
  const pb=document.getElementById('prevBtn'), nb=document.getElementById('nextBtn');
  pb.disabled=!p; nb.disabled=!n;
  document.getElementById('prevName').textContent=p?p.term:'—';
  document.getElementById('nextName').textContent=n?n.term:'—';
  document.getElementById('pos').textContent=`${t.i+1} of ${TERMS.length}`;
  buildIndex(document.getElementById('q').value);
  const cur=document.querySelector('.index [aria-current="true"]'); if(cur) cur.scrollIntoView({block:'nearest'});
  try{localStorage.setItem('ge-last',t.id)}catch(e){}
}
function reveal(){const pg=document.getElementById('pg'); if(pg) pg.classList.remove('hidden-q')}
function go(id){ if(location.hash.slice(1)===id) render(byId[id]); else location.hash=id; }
function route(){ const id=decodeURIComponent(location.hash.slice(1)); if(byId[id]) render(byId[id]); else showHome(); }
window.addEventListener('hashchange',route);

document.getElementById('prevBtn').onclick=()=>current&&TERMS[current.i-1]&&go(TERMS[current.i-1].id);
document.getElementById('nextBtn').onclick=()=>current&&TERMS[current.i+1]&&go(TERMS[current.i+1].id);
document.getElementById('homeBtn').onclick=showHome;
document.getElementById('menuBtn').onclick=()=>app.classList.toggle('drawer');
document.getElementById('shuffleBtn').onclick=()=>{let t;do{t=TERMS[Math.floor(Math.random()*TERMS.length)]}while(current&&t.id===current.id);go(t.id)};
const qb=document.getElementById('quizBtn');
qb.onclick=()=>{quiz=!quiz;qb.setAttribute('aria-pressed',quiz);if(current)render(current)};
const pbtn=document.getElementById('presentBtn');
pbtn.onclick=()=>{app.classList.toggle('present');pbtn.setAttribute('aria-pressed',app.classList.contains('present'))};
document.getElementById('q').addEventListener('input',e=>buildIndex(e.target.value));
app.addEventListener('click',e=>{ if(app.classList.contains('drawer') && !e.target.closest('.rail') && !e.target.closest('#menuBtn')) app.classList.remove('drawer') });
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'){ if(e.key==='Escape'){e.target.blur()} return; }
  if(e.key==='ArrowRight') document.getElementById('nextBtn').click();
  else if(e.key==='ArrowLeft') document.getElementById('prevBtn').click();
  else if(e.key==='q'||e.key==='Q') qb.click();
  else if(e.key==='r'||e.key==='R') document.getElementById('shuffleBtn').click();
  else if(e.key==='p'||e.key==='P') pbtn.click();
  else if(e.key==='/'){e.preventDefault();if(app.classList.contains('present'))pbtn.click();document.getElementById('q').focus()}
  else if(e.key===' ' && quiz){e.preventDefault();reveal()}
  else if(e.key==='Escape'){app.classList.remove('drawer'); if(app.classList.contains('present')) pbtn.click()}
});
route();
</script>
</body>
</html>
